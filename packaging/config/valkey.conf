# MDB default configuration.
#
# This file deliberately mirrors the usable container defaults of the upstream
# Valkey image without patching Valkey source: bind all interfaces, disable
# protected-mode inside the container boundary, persist to /data and log to
# stdout. TLS is opt-in through the example profiles.

bind * -::*
protected-mode no
port 6379
tls-port 0

daemonize no
supervised no
pidfile /run/mdb/valkey.pid
logfile ""
loglevel notice
databases 16

dir /data
save 3600 1 300 100 60 10000
appendonly no
appendfsync everysec

always-show-logo no
