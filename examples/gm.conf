# RFC 8998 TLS 1.3 national-cryptography profile, mTLS required.
# The mounted certificate must be SM2-with-SM3 and the CA must be SM2.

bind * -::*
protected-mode no
port 0
tls-port 6379

dir /data
daemonize no
supervised no
pidfile /run/mdb/valkey.pid
logfile ""
loglevel notice
save 3600 1 300 100 60 10000
appendonly no

tls-cert-file /run/mdb/tls/server.crt
tls-key-file /run/mdb/tls/server.key
tls-ca-cert-file /run/mdb/tls/ca.crt
tls-auth-clients yes
tls-protocols "TLSv1.3"
tls-ciphersuites TLS_SM4_GCM_SM3
tls-prefer-server-ciphers yes
tls-session-caching yes
