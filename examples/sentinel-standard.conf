# Sentinel configuration skeleton. Replace the monitor address and run with:
#   valkey-server /usr/local/share/mdb/examples/sentinel-standard.conf --sentinel

bind * -::*
protected-mode no
port 26379
dir /data
logfile ""
sentinel monitor mdb-primary 172.28.0.10 6379 2
sentinel down-after-milliseconds mdb-primary 5000
sentinel failover-timeout mdb-primary 60000

tls-port 26380
tls-cert-file /run/mdb/tls/server.crt
tls-key-file /run/mdb/tls/server.key
tls-ca-cert-file /run/mdb/tls/ca.crt
tls-auth-clients yes
tls-protocols "TLSv1.2 TLSv1.3"
tls-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
tls-ciphersuites TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
