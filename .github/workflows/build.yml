name: mdb build

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - ".dockerignore"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".gitignore"
      - ".dockerignore"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mdb-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate source and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: distfiles
          key: mdb-sources-${{ hashFiles('scripts/baseline.env') }}
          restore-keys: |
            mdb-sources-
      - run: make fetch
      - run: make verify
      - run: bash scripts/verify-remote-baselines.sh
      - run: python3 scripts/check-docs.py

  image:
    name: Build and smoke candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: validate
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/scott-wong/mdb:candidate-${{ github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: distfiles
          key: mdb-sources-${{ hashFiles('scripts/baseline.env') }}
          restore-keys: |
            mdb-sources-
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: make build
      - name: Push candidate
        if: github.event_name != 'pull_request'
        run: docker push "$IMAGE"
      - name: Re-pull candidate
        if: github.event_name != 'pull_request'
        run: docker pull "$IMAGE"
      - name: Standalone standard and GM smoke
        run: make smoke
      - name: Image metadata
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p artifacts
          docker image inspect "$IMAGE" \
            --format '{{index .RepoDigests 0}}' > artifacts/candidate-digest.txt
          cat artifacts/candidate-digest.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.event_name != 'pull_request'
        with:
          name: mdb-candidate
          path: artifacts/candidate-digest.txt
          retention-days: 7
          if-no-files-found: error
